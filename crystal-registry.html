<!DOCTYPE html> 
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>STATScore™ — Crystal Report Registry</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --red:#ff2b1f;
  --gold:#f4c542;
  --green:#25d366;
  --blue:#7ed8ff;
  --text:#f4f4f1;
  --muted:#b8c3cc;
  --line:rgba(255,255,255,.18);
  --panel:rgba(6,10,18,.72);
  --max:1536px;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  background:#000;
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

a{text-decoration:none;color:inherit}

.page{
  width:min(var(--max),100%);
  margin:0 auto;
  min-height:100vh;
  padding:28px;
  background:
    linear-gradient(90deg,rgba(0,0,0,.94),rgba(0,0,0,.68),rgba(0,0,0,.9)),
    radial-gradient(circle at 35% 20%,rgba(255,43,31,.12),transparent 34%),
    radial-gradient(circle at 76% 70%,rgba(126,216,255,.12),transparent 34%),
    #020202;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  margin-bottom:24px;
}

.back{
  border:1px solid var(--line);
  padding:12px 16px;
  text-transform:uppercase;
  font-size:.72rem;
  font-weight:900;
  letter-spacing:.16em;
  color:#fff;
  background:rgba(255,255,255,.03);
}

.title-block{
  border-bottom:2px solid var(--red);
  padding-bottom:22px;
  margin-bottom:22px;
}

.kicker{
  color:var(--red);
  font-size:.72rem;
  font-weight:900;
  letter-spacing:.28em;
  text-transform:uppercase;
  margin-bottom:10px;
}

h1{
  margin:0;
  font-family:"Arial Narrow","Helvetica Neue Condensed",Impact,Arial,sans-serif;
  font-size:3.5rem;
  line-height:.92;
  letter-spacing:-.04em;
  text-transform:uppercase;
}

.subline{
  margin-top:10px;
  color:var(--muted);
  font-weight:800;
  letter-spacing:.08em;
  text-transform:uppercase;
  font-size:.78rem;
}

.controls{
  display:grid;
  grid-template-columns:1fr 220px 220px 180px;
  gap:12px;
  margin-bottom:18px;
}

input,select,button{
  width:100%;
  min-height:48px;
  background:rgba(5,8,14,.78);
  border:1px solid rgba(255,255,255,.28);
  color:#fff;
  padding:12px;
  font-size:.8rem;
  font-weight:900;
  letter-spacing:.08em;
  text-transform:uppercase;
  outline:none;
}

button{
  cursor:pointer;
}

button.primary{
  border-color:var(--red);
  color:var(--red);
  background:rgba(255,43,31,.1);
}

.registry-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
}

.card{
  background:var(--panel);
  border:1px solid var(--line);
  padding:18px;
  min-height:250px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.035);
}

.card.archived{
  opacity:.45;
}

.card-type{
  color:var(--blue);
  font-size:.68rem;
  font-weight:900;
  letter-spacing:.18em;
  text-transform:uppercase;
  margin-bottom:10px;
}

.card-title{
  font-size:1.3rem;
  font-weight:900;
  text-transform:uppercase;
  margin-bottom:12px;
}

.meta{
  display:grid;
  gap:8px;
  margin-bottom:14px;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:14px;
  border-bottom:1px solid rgba(255,255,255,.1);
  padding-bottom:7px;
  font-size:.72rem;
  text-transform:uppercase;
  font-weight:900;
}

.row span{
  color:var(--blue);
}

.row b{
  color:var(--gold);
  text-align:right;
}

.status{
  color:var(--green)!important;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.action{
  min-height:42px;
  display:flex;
  justify-content:center;
  align-items:center;
  border:1px solid var(--line);
  font-size:.68rem;
  font-weight:900;
  letter-spacing:.12em;
  text-transform:uppercase;
  cursor:pointer;
}

.open{
  border-color:var(--green);
  color:var(--green);
}

.archive{
  border-color:var(--red);
  color:var(--red);
}

.message{
  margin:16px 0;
  color:var(--green);
  font-size:.74rem;
  font-weight:900;
  letter-spacing:.12em;
  text-transform:uppercase;
}

.empty{
  border:1px solid var(--line);
  padding:30px;
  color:var(--muted);
  text-transform:uppercase;
  font-weight:900;
  letter-spacing:.12em;
}

@media(max-width:1000px){
  .controls,.registry-grid{
    grid-template-columns:1fr;
  }

  h1{
    font-size:2.7rem;
  }
}
</style>
</head>

<body>
<div class="page">

  <div class="topbar">
    <a class="back" href="program.html">‹ Return To Program Room</a>
    <a class="back" href="system.html">System Home</a>
  </div>

  <section class="title-block">
    <div class="kicker">STATScore™ Intelligence Archive</div>
    <h1>Crystal Report Registry</h1>
    <div class="subline">Persistent institutional intelligence artifacts · Report archive · Version-controlled registry</div>
  </section>

  <section class="controls">
    <input id="searchInput" type="text" placeholder="Search reports..." />
    <select id="typeFilter">
      <option value="">All Report Types</option>
      <option value="PROGRAM_CRYSTAL_REPORT">Program Crystal Report</option>
    </select>
    <select id="statusFilter">
      <option value="">All Statuses</option>
      <option value="ACTIVE">Active</option>
      <option value="ARCHIVED">Archived</option>
    </select>
    <button class="primary" id="refreshBtn">Refresh</button>
  </section>

  <div class="message" id="systemMessage">Registry loading...</div>

  <section class="registry-grid" id="registryGrid"></section>

</div>

<script>
const SUPABASE_URL = "https://oyjmpbuxvfxusmbouldi.supabase.co";

/*
  Paste the SAME anon key currently working in program.html below.
  Do NOT use service_role.
*/
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im95am1wYnV4dmZ4dXNtYm91bGRpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk0NDkxNTcsImV4cCI6MjA4NTAyNTE1N30.S4P98vRR8AS7vsg5W-Dxg_fEtVoSlKscMOWEsigo5Mk";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

let REPORTS = [];

function esc(v){
  return String(v ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function setMessage(msg,type="success"){
  const el=document.getElementById("systemMessage");
  el.textContent=msg || "";
  el.style.color = type === "error" ? "var(--red)" : "var(--green)";
}

function fmtDate(v){
  if(!v)return "—";
  return new Date(v).toLocaleString();
}

function reportName(row){
  return row.source_entity_name ||
    row.payload?.program_name ||
    row.payload?.organization_name ||
    "Unnamed Report";
}

function reportScore(row){
  return row.payload?.health_score ??
    row.payload?.score ??
    "—";
}

function renderReports(){
  const grid=document.getElementById("registryGrid");
  const search=document.getElementById("searchInput").value.toLowerCase().trim();
  const type=document.getElementById("typeFilter").value;
  const status=document.getElementById("statusFilter").value;

  const filtered=REPORTS.filter(row=>{
    const text=[
      row.report_type,
      row.source_room,
      row.source_entity_name,
      row.report_status,
      row.sport_scope,
      row.benchmark_scope,
      JSON.stringify(row.payload || {})
    ].join(" ").toLowerCase();

    if(search && !text.includes(search))return false;
    if(type && row.report_type !== type)return false;
    if(status && row.report_status !== status)return false;
    return true;
  });

  if(!filtered.length){
    grid.innerHTML=`<div class="empty">No Crystal Reports found.</div>`;
    return;
  }

  grid.innerHTML=filtered.map(row=>{
    const archived=row.report_status==="ARCHIVED";
    return `
      <article class="card ${archived ? "archived" : ""}">
        <div>
          <div class="card-type">${esc(row.report_type || "CRYSTAL_REPORT")}</div>
          <div class="card-title">${esc(reportName(row))}</div>

          <div class="meta">
            <div class="row"><span>Status</span><b class="status">${esc(row.report_status || "ACTIVE")}</b></div>
            <div class="row"><span>Version</span><b>${esc(row.report_version || "CRYSTAL_REPORT_V1")}</b></div>
            <div class="row"><span>Source</span><b>${esc(row.source_room || "—")}</b></div>
            <div class="row"><span>Sport</span><b>${esc(row.sport_scope || row.payload?.sport_scope || "—")}</b></div>
            <div class="row"><span>Benchmark</span><b>${esc(row.benchmark_scope || row.payload?.benchmark_scope || "—")}</b></div>
            <div class="row"><span>Score</span><b>${esc(reportScore(row))}</b></div>
            <div class="row"><span>Generated</span><b>${esc(fmtDate(row.generated_at))}</b></div>
          </div>
        </div>

        <div class="actions">
          <a class="action open" href="crystal-report.html?report_id=${esc(row.report_id)}">Open</a>
          <div class="action archive" onclick="archiveReport('${esc(row.report_id)}')">Archive</div>
        </div>
      </article>
    `;
  }).join("");
}

async function loadReports(){
  setMessage("Loading Crystal Report Registry...");

  const { data, error } = await supabaseClient
    .from("sc_crystal_reports")
    .select("*")
    .order("generated_at", { ascending:false });

  if(error){
    console.error(error);
    setMessage("Registry load failed. Check RLS/select policy.", "error");
    return;
  }

  REPORTS = data || [];
  renderReports();
  setMessage(`Registry loaded · ${REPORTS.length} reports found`);
}

async function archiveReport(reportId){
  const { error } = await supabaseClient
    .from("sc_crystal_reports")
    .update({
      report_status:"ARCHIVED",
      archived_at:new Date().toISOString()
    })
    .eq("report_id", reportId);

  if(error){
    console.error(error);
    setMessage("Archive failed. Check update RLS policy.", "error");
    return;
  }

  setMessage("Report archived");
  loadReports();
}

document.addEventListener("DOMContentLoaded",()=>{
  document.getElementById("refreshBtn").addEventListener("click",loadReports);
  document.getElementById("searchInput").addEventListener("input",renderReports);
  document.getElementById("typeFilter").addEventListener("change",renderReports);
  document.getElementById("statusFilter").addEventListener("change",renderReports);

  loadReports();
});
</script>

</body>
</html>
