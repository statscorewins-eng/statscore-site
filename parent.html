<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>STATScore™ — Parent / Guardian Room</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --red:#ff2b1f;
  --gold:#f4c542;
  --green:#25d366;
  --panel:rgba(6,10,18,.62);
  --line:rgba(255,255,255,.18);
  --line2:rgba(255,255,255,.34);
  --text:#f4f4f1;
  --muted:#b8c3cc;
  --blue:#7ed8ff;
  --max:1536px;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  background:#000;
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

a{text-decoration:none;color:inherit}

.page{
  width:min(var(--max),100%);
  margin:0 auto;
  min-height:100vh;
  background:
    linear-gradient(90deg,rgba(0,0,0,.9),rgba(0,0,0,.62),rgba(0,0,0,.84)),
    radial-gradient(circle at 40% 25%,rgba(255,43,31,.13),transparent 35%),
    radial-gradient(circle at 78% 75%,rgba(126,216,255,.12),transparent 35%),
    #020202;
}

.header{
  min-height:92px;
  background:linear-gradient(180deg,#fff,#ededeb);
  display:grid;
  grid-template-columns:390px 1fr 430px;
  align-items:center;
  border-bottom:2px solid var(--red);
}

.logo-tab{
  height:92px;
  background:linear-gradient(145deg,#151515,#050505 65%,#000);
  clip-path:polygon(0 0,78% 0,100% 100%,0 100%);
  display:flex;
  align-items:center;
  padding-left:26px;
  position:relative;
}

.logo-tab:before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  width:140px;
  height:16px;
  background:var(--red);
  clip-path:polygon(0 0,92% 0,100% 100%,0 100%);
}

.logo-tab:after{
  content:"";
  position:absolute;
  bottom:0;
  left:0;
  right:34px;
  height:3px;
  background:var(--red);
}

.logo-tab img{width:292px;max-width:78%}

.header-title{
  text-align:center;
  color:#111;
  font-weight:900;
  font-size:.78rem;
  letter-spacing:.34em;
  text-transform:uppercase;
}

.header-nav{
  display:flex;
  justify-content:flex-end;
  align-items:center;
  gap:13px;
  padding-right:24px;
  color:#111;
}

.header-nav a{
  font-weight:900;
  font-size:.75rem;
  letter-spacing:.13em;
  text-transform:uppercase;
  padding-bottom:12px;
  border-bottom:2px solid transparent;
}

.header-nav a.active{
  color:var(--red);
  border-bottom-color:var(--red);
}

.user-icon{
  width:30px;
  height:30px;
  border:3px solid #111;
  border-radius:50%;
}

.role-tabs{
  display:grid;
  grid-template-columns:repeat(8,1fr);
  border-bottom:2px solid var(--red);
  background:rgba(3,5,9,.88);
}

.role-tabs a{
  min-height:72px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-right:1px solid rgba(255,255,255,.16);
  color:#eaf8ff;
  font-size:.82rem;
  font-weight:900;
  letter-spacing:.11em;
  text-transform:uppercase;
  background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.01));
}

.role-tabs a.active{
  background:linear-gradient(180deg,rgba(255,43,31,.85),rgba(255,43,31,.42));
  color:#fff;
  border-color:rgba(255,43,31,.9);
}

.main{
  padding:22px 32px 0;
  background:repeating-linear-gradient(135deg,rgba(255,255,255,.018) 0,rgba(255,255,255,.018) 1px,transparent 1px,transparent 7px);
}

.record-header{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:20px;
  margin-bottom:16px;
  padding-bottom:14px;
  border-bottom:1px solid rgba(255,255,255,.12);
}

.record-kicker{
  color:var(--red);
  font-size:.72rem;
  font-weight:900;
  letter-spacing:.24em;
  text-transform:uppercase;
  margin-bottom:8px;
}

.record-title{
  margin:0;
  font-family:"Arial Narrow","Helvetica Neue Condensed",Impact,Arial,sans-serif;
  font-size:3.6rem;
  line-height:.9;
  letter-spacing:-.04em;
  text-transform:uppercase;
}

.record-badge{
  border:1px solid rgba(255,255,255,.16);
  padding:10px 14px;
  font-size:.7rem;
  color:#9fa7b0;
  font-weight:900;
  letter-spacing:.18em;
  text-transform:uppercase;
  background:rgba(255,255,255,.03);
}

.shell-grid{
  display:grid;
  grid-template-columns:300px 1fr 350px;
  gap:14px;
  align-items:start;
}

  background
