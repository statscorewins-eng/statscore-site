<!DOCTYPE html>  
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>STATScore™</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<style>

:root{

/* CORE */
--black:#040506;
--dark:#090c11;
--panel:#0d1117;
--text:#ffffff;
--muted:#98a3b6;

/* STATSCORE RED SYSTEM */
--red:#e11d2e;
--red-bright:#ff3245;
--red-deep:#93131d;
--red-shadow:#4e0910;

}

/* =========================
RESET
========================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,
body{
height:100%;
font-family:'Inter',sans-serif;
background:var(--black);
color:var(--text);
overflow:hidden;
}

/* =========================
PAGE
========================= */

.page{
height:100vh;
display:flex;
flex-direction:column;
background:#000;
}

/* =========================
HERO
========================= */

.hero{

flex:0 0 72%;

position:relative;

display:flex;
align-items:center;
justify-content:center;

overflow:hidden;

background:
linear-gradient(
180deg,
#ffffff 0%,
#f7f7f7 100%
);

}

/* LOWER SHADOW BLEND */
.hero::after{

content:"";

position:absolute;
left:0;
right:0;
bottom:0;

height:120px;

background:
linear-gradient(
180deg,
rgba(0,0,0,0) 0%,
rgba(0,0,0,.08) 45%,
rgba(0,0,0,.22) 100%
);

pointer-events:none;
}

/* SOFT EDGE SHADOW */
.hero::before{

content:"";

position:absolute;
inset:0;

box-shadow:
inset 0 -28px 50px rgba(0,0,0,.08);

pointer-events:none;
}

.hero img{

width:110%;
height:auto;

object-fit:cover;
object-position:center;

filter:
contrast(1.02)
saturate(1.03);

}

/* =========================
ACCESS SECTION
========================= */

.access{
  flex:1;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;

  background:
    linear-gradient(
      180deg,
      #10141b 0%,
      #0a0d12 48%,
      #05070a 100%
    );

  border-top:1px solid rgba(255,47,60,.28);
}

.access::before{
  content:"";
  position:absolute;
  inset:0;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.015),
      rgba(255,255,255,0)
    );

  pointer-events:none;
}

.access::after{
  content:"";
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:1px;

  background:rgba(255,47,60,.75);

  pointer-events:none;
} 

/* =========================
CONTENT
========================= */

.access-inner{

position:relative;
z-index:2;

display:flex;
flex-direction:column;
align-items:center;

gap:18px;

padding:20px;

}

/* =========================
HEADLINE
========================= */

.headline{

font-size:clamp(1.45rem, 2vw, 2.1rem);

font-weight:800;

letter-spacing:-0.045em;
line-height:1.02;

color:#ffffff;

text-shadow:
0 0 18px rgba(255,255,255,.08);

}

/* =========================
BUTTON
========================= */

.enter{

position:relative;

min-width:190px;

padding:15px 34px;

font-size:.74rem;
font-weight:900;

letter-spacing:.24em;
text-transform:uppercase;

color:#ffffff;

background:

linear-gradient(
180deg,
#ef3344 0%,
#cf1e2d 42%,
#a71320 100%
);

border:1px solid #7f0f19;

border-radius:2px;

cursor:pointer;

transition:
transform .16s ease,
background .16s ease,
border-color .16s ease;

box-shadow:
  0 0 0 1px rgba(0,0,0,.35); 

/* HOVER */
.enter:hover{

  background:
    linear-gradient(
      180deg,
      #d92a36 0%,
      #b31d28 100%
    );

  border-color:rgba(255,255,255,.10);
} 
    
/* CLICK */
.enter:active{

transform:translateY(1px);

} 

/* =========================
SUBTEXT
========================= */

.sub{

font-size:.92rem;

font-weight:600;

color:var(--muted);

letter-spacing:.01em;

}

.sub strong{

color:#ffffff;
font-weight:900;

}

/* =========================
MOBILE
========================= */

@media(max-width:768px){

.hero{
flex:0 0 65%;
}

.hero img{
width:132%;
}

.headline{

font-size:clamp(1.4rem, 2vw, 1.95rem);

font-weight:750;

letter-spacing:-0.05em;

line-height:1.02;

}

.enter{

padding:13px 24px;

font-size:.71rem;

min-width:175px;

}

.sub{
font-size:.86rem;
}

}

</style>
</head>

<body>

<div class="page">

    <!-- HERO -->
    <section class="hero">

        <img
            src="statscore-logo.png"
            alt="STATScore Logo"
        >

    </section>

    <!-- ACCESS -->
    <section class="access">

        <div class="access-inner">

            <h1 class="headline">
                Athlete Performance Starts Here
            </h1>

            <button
                class="enter"
                onclick="window.location.href='system.html'"
            >
                Enter
            </button>

            <p class="sub">
                Track it. Score it.
                <strong>Prove it.</strong>
            </p>

        </div>

    </section>

</div>

</body>
</html>
