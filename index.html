<!DOCTYPE html>  
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>STATS-CORE™ | Athlete Lifecycle System</title>

<meta
  name="title"
  content="STATS-CORE™ | Athlete Lifecycle System"
/>

<meta
  name="description"
  content="STATS-CORE™ Athlete Lifecycle System — verified athlete infrastructure for performance tracking, readiness intelligence, eligibility awareness, recruiting visibility, and controlled communication."
/>

<link
  rel="icon"
  type="image/png"
  href="sc_emblem.png"
/>

<link
  rel="apple-touch-icon"
  href="sc_emblem.png"
/> 

<style>
:root{
  --logo-white:#ecebe6;
  --black:#05070a;
  --dark:#0b1018;
  --text:#ffffff;
  --muted:#9ea7b5;
  --red:#e02020;
  --red-bright:#ff3434;
  --red-deep:#991414;
}

*{margin:0;padding:0;box-sizing:border-box}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:'Inter',sans-serif;
  background:var(--logo-white);
}

.page{
  width:100vw;
  height:100vh;
  display:flex;
  flex-direction:column;
  background:var(--logo-white);
}

.hero{
  flex:0 0 72vh;
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:var(--logo-white);
}

.hero img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  object-position:center center;
}

.access{
  flex:1;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:linear-gradient(180deg,#151c28 0%,#0d1420 45%,#06090d 100%);
  border-top:1px solid rgba(224,32,32,.45);
}

.access::after{
  content:"";
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:1px;
  background:rgba(255,52,52,.9);
}

.access-inner{
  position:relative;
  z-index:2;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:18px;
  padding:20px;
  text-align:center;
}

.headline{
  font-size:clamp(1.45rem,2vw,2.15rem);
  font-weight:800;
  letter-spacing:-0.045em;
  line-height:1.02;
  color:#fff;
}

.enter{
  min-width:190px;
  padding:15px 34px;
  font-size:.74rem;
  font-weight:900;
  letter-spacing:.24em;
  text-transform:uppercase;
  color:#fff;
  background:linear-gradient(180deg,#ff3a3a 0%,#e02020 48%,#b01515 100%);
  border:1px solid #7a0d0d;
  border-radius:2px;
  cursor:pointer;
  box-shadow:0 0 0 1px rgba(0,0,0,.35),0 12px 30px rgba(224,32,32,.18);
}

.sub{
  font-size:.92rem;
  font-weight:600;
  color:var(--muted);
}

.sub strong{
  color:#fff;
  font-weight:900;
}

/* =========================================================
   MOBILE VIEW ONLY
========================================================= */
<style>
@media(max-width:768px){
  body{
    background:#05070b;
  }

  .entry,
  .hero,
  .landing,
  main{
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    justify-content:flex-start;
    background:
      linear-gradient(180deg,#f4f4f1 0%,#f4f4f1 34%,#05070b 34%,#05070b 100%);
  }

  .logo-wrap,
  .logo-panel,
  .brand-panel{
    margin:0 auto;
    padding:54px 22px 34px;
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    background:radial-gradient(circle,rgba(255,43,31,.18),transparent 62%);
  }

  .logo-wrap img,
  .logo-panel img,
  .brand-panel img{
    width:min(78vw,360px);
    max-height:180px;
    object-fit:contain;
  }

  .entry-content,
  .hero-content,
  .landing-content{
    width:100%;
    padding:46px 26px 42px;
    background:
      linear-gradient(180deg,rgba(7,12,22,.98),rgba(2,4,8,.98)),
      repeating-linear-gradient(135deg,rgba(255,255,255,.025) 0,rgba(255,255,255,.025) 1px,transparent 1px,transparent 8px);
    border-top:2px solid #ff2b1f;
    text-align:center;
  }

  h1,
  .hero-title,
  .entry-title{
    font-size:clamp(2.15rem,9vw,3.35rem);
    line-height:1.02;
    margin:0 auto 28px;
    max-width:420px;
    letter-spacing:-.04em;
  }

  .enter-btn,
  .btn-enter,
  a[href*="login"],
  button{
    width:min(100%,340px);
    min-height:66px;
    margin:0 auto 24px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(180deg,#ff3b32,#b90710);
    color:#fff;
    border:1px solid rgba(255,255,255,.16);
    box-shadow:0 18px 40px rgba(255,43,31,.24);
    font-size:.9rem;
    font-weight:900;
    letter-spacing:.24em;
    text-transform:uppercase;
  }

  .tagline,
  .subline,
  .entry-subtitle{
    color:#b8c3cc;
    font-size:1.05rem;
    font-weight:800;
    line-height:1.4;
    margin:0;
  }

  .tagline strong,
  .subline strong{
    color:#fff;
  }

  .spacer,
  .blank-space{
    display:none!important;
  }
}
</style> 

</body>
</html>
