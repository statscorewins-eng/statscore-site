<!DOCTYPE html> 
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STATScore™</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root{
--black:#05070a;
--dark:#0b0f15;
--text:#ffffff;
--muted:#9ca6b8;
--red:#ff2f3c;
--red-dark:#d91522;
}

*{
box-sizing:border-box;
margin:0;
padding:0;
}

html,body{
height:100%;
font-family:'Inter',sans-serif;
background:var(--black);
color:var(--text);
}

.page{
height:100vh;
display:flex;
flex-direction:column;
}

/* =========================
   HERO — PRIMARY AUTHORITY
========================= */
.hero{
flex:0 0 72%;
background:#ffffff;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
position:relative;
}

.hero::after{
content:"";
position:absolute;
inset:0;
border-bottom:1px solid rgba(255,255,255,.18);
box-shadow:inset 0 -24px 50px rgba(0,0,0,.08);
pointer-events:none;
}

.hero img{
width:110%;
max-width:none;
height:auto;
object-fit:cover;
object-position:center;
}

/* =========================
   ACCESS SECTION
========================= */
.access{
flex:1;
background:
linear-gradient(180deg, #0d1420 0%, #07090d 100%);
display:flex;
align-items:center;
justify-content:center;
text-align:center;
position:relative;
overflow:hidden;
}

.access::before{
content:"";
position:absolute;
inset:0;
background:
radial-gradient(circle at 50% 0%, rgba(255,47,60,.18), transparent 38%),
linear-gradient(90deg, transparent, rgba(255,255,255,.035), transparent);
pointer-events:none;
}

.access-inner{
position:relative;
z-index:2;
display:flex;
flex-direction:column;
align-items:center;
gap:18px;
}

.headline{
font-size:clamp(1.45rem, 2vw, 2.1rem);
font-weight:700;
letter-spacing:-0.04em;
line-height:1.05;
color:#ffffff;
text-shadow:
0 0 24px rgba(255,255,255,0.08);
}

.enter{
padding:13px 30px;

font-size:0.74rem;
font-weight:800;
letter-spacing:0.24em;
text-transform:uppercase;

background:
linear-gradient(
180deg,
#ff4a54 0%,
#dc1f2b 100%
);

border:
1px solid rgba(255,255,255,0.12);

border-radius:2px;

color:#ffffff;

cursor:pointer;

box-shadow:
0 1px 0 rgba(255,255,255,0.08) inset,
0 0 0 1px rgba(0,0,0,0.28);

transition:
background .16s ease,
transform .16s ease,
border-color .16s ease;
}

.enter:hover{
transform:translateY(-1px);

background:
linear-gradient(
180deg,
#ff5660 0%,
#e02230 100%
);

border-color:
rgba(255,255,255,0.18);
} 

.sub{
font-size:0.9rem;
color:var(--muted);
font-weight:600;
letter-spacing:.01em;
}

.sub strong{
color:#ffffff;
font-weight:900;
}

/* MOBILE */
@media(max-width:768px){
.hero{
flex:0 0 65%;
}

.hero img{
width:130%;
}

.headline{
font-size:clamp(1.4rem, 2vw, 2rem);
font-weight:650;
letter-spacing:-0.045em;
line-height:1.02;

color:#ffffff;
} 

.enter{
padding:12px 22px;
font-size:0.72rem;
}
}
</style>
</head>

<body>

<div class="page">

  <section class="hero">
    <img src="statscore-logo.png" alt="STATScore Logo">
  </section>

  <section class="access">
    <div class="access-inner">
      <h1 class="headline">Athlete Performance Starts Here</h1>

      <button class="enter" onclick="window.location.href='system.html'">
        Enter
      </button>

      <p class="sub">
        Track it. Score it. <strong>Prove it.</strong>
      </p>
    </div>
  </section>

</div>

</body>
</html>
