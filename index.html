<!DOCTYPE html> 
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>
STATScore™ — Athlete Lifecycle System
</title> 

  <meta
  name="description"
  content="STATScore™ Athlete Lifecycle System — National athlete identity, eligibility, readiness, rankings, verification, and performance infrastructure."
/> 
  
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root{
  --logo-white:#ecebe6;
  --black:#05070a;
  --dark:#0b1018;
  --text:#ffffff;
  --muted:#9ea7b5;
  --red:#e02020;
  --red-bright:#ff3434;
  --red-deep:#991414;
}

*{margin:0;padding:0;box-sizing:border-box}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:'Inter',sans-serif;
  background:var(--logo-white);
}

.page{
  width:100vw;
  height:100vh;
  display:flex;
  flex-direction:column;
  background:var(--logo-white);
}

.hero{
  flex:0 0 72vh;
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:var(--logo-white);
}

.hero img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  object-position:center center;
}

.access{
  flex:1;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:linear-gradient(180deg,#151c28 0%,#0d1420 45%,#06090d 100%);
  border-top:1px solid rgba(224,32,32,.45);
}

.access::after{
  content:"";
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:1px;
  background:rgba(255,52,52,.9);
}

.access-inner{
  position:relative;
  z-index:2;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:18px;
  padding:20px;
  text-align:center;
}

.headline{
  font-size:clamp(1.45rem,2vw,2.15rem);
  font-weight:800;
  letter-spacing:-0.045em;
  line-height:1.02;
  color:#fff;
}

.enter{
  min-width:190px;
  padding:15px 34px;
  font-size:.74rem;
  font-weight:900;
  letter-spacing:.24em;
  text-transform:uppercase;
  color:#fff;
  background:linear-gradient(180deg,#ff3a3a 0%,#e02020 48%,#b01515 100%);
  border:1px solid #7a0d0d;
  border-radius:2px;
  cursor:pointer;
  box-shadow:0 0 0 1px rgba(0,0,0,.35),0 12px 30px rgba(224,32,32,.18);
}

.sub{
  font-size:.92rem;
  font-weight:600;
  color:var(--muted);
}

.sub strong{
  color:#fff;
  font-weight:900;
}

/* MOBILE VIEW ONLY */
@media(max-width:768px){

  .hero{
    flex:0 0 44dvh;
    height:44dvh;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
      radial-gradient(circle at center,
      rgba(255,45,45,.22) 0%,
      rgba(255,45,45,.10) 22%,
      rgba(245,245,245,1) 58%);

    overflow:hidden;
  }

  .hero img{
    width:100%;
    height:100%;

    object-fit:contain;
    object-position:center center;

    transform:scale(1.18);

    filter:
      drop-shadow(0 0 18px rgba(255,45,45,.28))
      drop-shadow(0 0 42px rgba(255,45,45,.16));
  }

  .access{
    flex:0 0 56dvh;
    height:56dvh;
    align-items:flex-start;
    padding-top:44px;
  }
} 

@media(max-width:430px){
  .hero{
    flex-basis:44dvh;
    height:44dvh;
  }

  .access{
    flex-basis:56dvh;
    height:56dvh;
  }

  .hero img{
    transform:scale(1.22);
  }
} 

</style>
</head>

<body>
<div class="page">

  <section class="hero">
    <img src="statscore_logo_v3.png" alt="STATScore Logo">
  </section>

  <section class="access">
    <div class="access-inner">
      <h1 class="headline">Athlete Performance Starts Here</h1>

      <button class="enter" onclick="window.location.href='login.html'">
        Enter
      </button>

      <p class="sub">Track it. Score it. <strong>Prove it.</strong></p>
    </div>
  </section>

</div>
</body>
</html>
