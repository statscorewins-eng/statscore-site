<!DOCTYPE html> 
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>STATScore — Login</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

html,body{
  width:100%;
  min-height:100%;
  font-family:Arial, Helvetica, sans-serif;
  background:#8b0000;
  color:white;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:
    linear-gradient(135deg,#3a0000,#9b0000 45%,#160000);
}

.login{
  width:100%;
  max-width:420px;
  background:rgba(0,0,0,.58);
  border:1px solid rgba(255,255,255,.18);
  padding:34px;
  box-shadow:0 20px 60px rgba(0,0,0,.45);
}

.logo{
  width:280px;
  display:block;
  margin:0 auto 30px;
  opacity:1;
  filter:
    brightness(2.15)
    contrast(1.35)
    saturate(1.25)
    drop-shadow(0 0 18px rgba(255,60,40,.55));
} 

h1{
  text-align:center;
  font-size:2rem;
  text-transform:uppercase;
  letter-spacing:.08em;
  margin-bottom:10px;
}

p{
  text-align:center;
  color:#ddd;
  font-size:.9rem;
  line-height:1.45;
  margin-bottom:28px;
}

label{
  display:block;
  margin-bottom:8px;
  font-size:.75rem;
  font-weight:900;
  letter-spacing:.16em;
  text-transform:uppercase;
}

input{
  width:100%;
  height:52px;
  margin-bottom:18px;
  padding:0 14px;
  background:#111;
  border:1px solid rgba(255,255,255,.22);
  color:white;
  font-size:1rem;
  outline:none;
}

input:focus{
  border-color:#ff3b30;
}

button{
  width:100%;
  height:56px;
  border:none;
  background:#ff2b1f;
  color:white;
  font-weight:900;
  letter-spacing:.16em;
  text-transform:uppercase;
  cursor:pointer;
}

.status{
  margin-top:18px;
  text-align:center;
  font-size:.8rem;
  font-weight:900;
  letter-spacing:.12em;
  text-transform:uppercase;
}

.error{color:#ffb3ad}
.success{color:#37e66b}

.demo{
  margin-top:24px;
  padding-top:18px;
  border-top:1px solid rgba(255,255,255,.14);
  color:#ddd;
  font-size:.8rem;
  line-height:1.6;
}
</style>
</head>

<body>

<div class="login">
  <img class="logo" src="statscore-logo.png" alt="STATScore">

  <h1>System Login</h1>

  <p>
    Controlled access for athlete profiles, recruiting visibility,
    verification, eligibility, and system routing.
  </p>

  <form onsubmit="event.preventDefault(); loginDemo();">
    <label>Email</label>
    <input id="email" type="email" placeholder="Enter email">

    <label>Password</label>
    <input id="password" type="password" placeholder="Enter password">

    <button type="submit">Access System</button>
  </form>

  <div id="status" class="status"></div>

  <div class="demo">
    Demo password: <b>demo123</b><br>
    athlete@demo.com<br>
    parent@demo.com<br>
    coach@demo.com<br>
    counselor@demo.com<br>
    recruiter@demo.com<br>
    evaluator@demo.com<br>
    program@demo.com
  </div>
</div>

<script>
const DEMO_USERS = {
  "athlete@demo.com": "system.html?role=athlete",
  "parent@demo.com": "system.html?role=parent",
  "coach@demo.com": "system.html?role=coach",
  "counselor@demo.com": "system.html?role=counselor",
  "recruiter@demo.com": "system.html?role=recruiter",
  "evaluator@demo.com": "system.html?role=evaluator",
  "program@demo.com": "system.html?role=program"
};

function loginDemo(){
  const email = document.getElementById("email").value.trim().toLowerCase();
  const password = document.getElementById("password").value.trim();
  const status = document.getElementById("status");

  if(!DEMO_USERS[email] || password !== "demo123"){
    status.textContent = "Invalid authorization";
    status.className = "status error";
    return;
  }

  sessionStorage.setItem("statscore_role", email.split("@")[0]);
  sessionStorage.setItem("statscore_email", email);

  status.textContent = "Access granted";
  status.className = "status success";

  setTimeout(() => {
    window.location.href = DEMO_USERS[email];
  }, 700);
}
</script>

</body>
</html>
